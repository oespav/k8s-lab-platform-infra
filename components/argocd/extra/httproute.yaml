# Argo CD UI at https://argocd.internal.localhost via the internal gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  parentRefs:
    - name: internal
      namespace: infra-gw
      sectionName: https
  hostnames:
    - argocd.internal.localhost
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
