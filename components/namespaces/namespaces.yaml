# Platform-owned namespaces. Team namespaces live in argocd/tenants/.
# gateway-access/* labels decide which shared Gateway a namespace may use.
apiVersion: v1
kind: Namespace
metadata:
  name: infra-gw
---
# Home of the agentgateway-backed public gateway. Enrolled in ambient so the
# proxy's calls to app pods carry the identity edge-gw/sa/<gateway>, which the
# teams' L4/L7 policies can then allow. Istio-managed gateways are NOT enrolled
# (they speak HBONE natively); agentgateway proxies are ordinary pods.
apiVersion: v1
kind: Namespace
metadata:
  name: edge-gw
  labels:
    istio.io/dataplane-mode: ambient
---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    gateway-access/internal: "true"     # Argo CD UI route
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: traffic-console
  labels:
    gateway-access/internal: "true"
    istio.io/dataplane-mode: ambient   # its east-west calls carry a mesh identity
