# Mesh-wide baseline, owned by the platform team: workloads in the mesh only
# accept mutual-TLS connections. Plain-text traffic from outside the mesh
# (e.g. a pod in a non-enrolled namespace) to an enrolled pod is refused.
# Placed in the root namespace (istio-system), so it applies everywhere.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: istio-system
spec:
  mtls:
    mode: STRICT
