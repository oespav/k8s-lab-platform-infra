{{- range $name, $gw := .Values.gateways }}
{{- if $gw.enabled }}
---
# Proxy customization for this gateway. The agentgateway control plane renders
# a Deployment/Service/ServiceAccount per Gateway and merges these overlays on
# top (strategic merge, like kubectl apply).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: {{ $name }}-params
  labels:
    {{- include "platform-gateway.labels" $ | nindent 4 }}
spec:
  {{- with $gw.nodePorts }}
  # Pin NodePorts so the edge load balancer can target them.
  service:
    spec:
      type: {{ $gw.serviceType }}
      ports:
        - port: 443
          nodePort: {{ .https }}
        - port: 80
          nodePort: {{ .http }}
  {{- end }}
  {{- with $gw.autoscaling }}
  horizontalPodAutoscaler:
    spec:
      minReplicas: {{ .minReplicas }}
      maxReplicas: {{ .maxReplicas }}
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: {{ .targetCPUUtilizationPercentage }}
  {{- end }}
  {{- with $gw.podDisruptionBudget }}
  podDisruptionBudget:
    spec:
      {{- toYaml . | nindent 6 }}
  {{- end }}
---
# Wildcard certificate for every hostname this gateway serves.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}-tls
  labels:
    {{- include "platform-gateway.labels" $ | nindent 4 }}
spec:
  secretName: {{ $name }}-tls
  dnsNames:
    - {{ $gw.hostname | quote }}
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    {{- toYaml $.Values.tls.issuer | nindent 4 }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $name }}
  labels:
    {{- include "platform-gateway.labels" $ | nindent 4 }}
spec:
  gatewayClassName: {{ $gw.className }}
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: {{ $name }}-params
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: {{ $gw.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ $name }}-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              {{ $gw.accessLabel }}: "true"
    - name: http
      port: 80
      protocol: HTTP
      hostname: {{ $gw.hostname | quote }}
      allowedRoutes:
        namespaces:
          from: Same      # only the redirect below
---
# Every plain-HTTP request gets a 301 to the same URL on HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}-https-redirect
  labels:
    {{- include "platform-gateway.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $name }}
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
            {{- with $gw.redirectPort }}
            port: {{ . }}
            {{- end }}
{{- end }}
{{- end }}
