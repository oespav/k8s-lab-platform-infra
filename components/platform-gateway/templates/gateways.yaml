{{- range $name, $gw := .Values.gateways }}
{{- if $gw.enabled }}
{{- /* Listener ports. Istio uses them as the gateway Service's ports, so on a
       LoadBalancer they are also the ports the load balancer publishes. */}}
{{- $ports := default dict $gw.ports }}
{{- $httpsPort := default 443 $ports.https }}
{{- $httpPort := default 80 $ports.http }}
---
# Istio reads this ConfigMap (via infrastructure.parametersRef) and merges
# each key into the Deployment/HPA/PDB it generates for the Gateway.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-gateway-options
  labels:
    {{- include "platform-gateway.labels" $ | nindent 4 }}
data:
  {{- if or $gw.nodePorts $gw.hideStatusPort }}
  # Patched into the gateway Service (strategic merge):
  #   nodePorts       pin them so an external load balancer can target them
  #   hideStatusPort  drop Istio's health port 15021, which Istio adds to every
  #                   gateway Service -- two LoadBalancers can't both publish it
  service: |
    spec:
      ports:
        {{- with $gw.nodePorts }}
        - port: {{ $httpsPort }}
          nodePort: {{ .https }}
        - port: {{ $httpPort }}
          nodePort: {{ .http }}
        {{- end }}
        {{- if $gw.hideStatusPort }}
        - port: 15021
          $patch: delete
        {{- end }}
  {{- end }}
  deployment: |
    spec:
      template:
        spec:
          containers:
            - name: istio-proxy
              resources:
                {{- toYaml $gw.resources | nindent 16 }}
  {{- with $gw.autoscaling }}
  horizontalPodAutoscaler: |
    spec:
      minReplicas: {{ .minReplicas }}
      maxReplicas: {{ .maxReplicas }}
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: {{ .targetCPUUtilizationPercentage }}
  {{- end }}
  {{- with $gw.podDisruptionBudget }}
  podDisruptionBudget: |
    spec:
      {{- toYaml . | nindent 6 }}
  {{- end }}
---
# Wildcard certificate for every hostname this gateway serves.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}-tls
  labels:
    {{- include "platform-gateway.labels" $ | nindent 4 }}
spec:
  secretName: {{ $name }}-tls
  dnsNames:
    - {{ $gw.hostname | quote }}
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    {{- toYaml $.Values.tls.issuer | nindent 4 }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $name }}
  labels:
    {{- include "platform-gateway.labels" $ | nindent 4 }}
  annotations:
    networking.istio.io/service-type: {{ $gw.serviceType }}
spec:
  gatewayClassName: {{ $gw.className }}
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: {{ $name }}-gateway-options
  listeners:
    - name: https
      port: {{ $httpsPort }}
      protocol: HTTPS
      hostname: {{ $gw.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ $name }}-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              {{ $gw.accessLabel }}: "true"
    - name: http
      port: {{ $httpPort }}
      protocol: HTTP
      hostname: {{ $gw.hostname | quote }}
      allowedRoutes:
        namespaces:
          from: Same      # only the redirect below
---
# Every plain-HTTP request gets a 301 to the same URL on HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}-https-redirect
  labels:
    {{- include "platform-gateway.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $name }}
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
            {{- with $gw.redirectPort }}
            port: {{ . }}
            {{- end }}
{{- end }}
{{- end }}
