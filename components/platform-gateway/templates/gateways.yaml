{{- range $name, $gw := .Values.gateways }}
{{- if $gw.enabled }}
{{- $impl := $gw.implementation | default "istio" }}
{{- if eq $impl "agentgateway" }}
---
# agentgateway reads this (via infrastructure.parametersRef) and merges each
# overlay into the Deployment/Service/HPA/PDB it generates for the Gateway.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: {{ $name }}-gateway-options
  labels:
    {{- include "platform-gateway.labels" $ | nindent 4 }}
spec:
  {{- with $gw.nodePorts }}
  service:
    spec:
      type: {{ $gw.serviceType }}
      ports:
        - port: 443
          nodePort: {{ .https }}
        - port: 80
          nodePort: {{ .http }}
  {{- end }}
  {{- with $gw.autoscaling }}
  horizontalPodAutoscaler:
    spec:
      minReplicas: {{ .minReplicas }}
      maxReplicas: {{ .maxReplicas }}
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: {{ .targetCPUUtilizationPercentage }}
  {{- end }}
  {{- with $gw.podDisruptionBudget }}
  podDisruptionBudget:
    spec:
      {{- toYaml . | nindent 6 }}
  {{- end }}
{{- else }}
---
# Istio reads this ConfigMap (via infrastructure.parametersRef) and merges
# each key into the Deployment/HPA/PDB it generates for the Gateway.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-gateway-options
  labels:
    {{- include "platform-gateway.labels" $ | nindent 4 }}
data:
  {{- with $gw.nodePorts }}
  # Pin NodePorts so the edge load balancer can target them.
  service: |
    spec:
      ports:
        - port: 443
          nodePort: {{ .https }}
        - port: 80
          nodePort: {{ .http }}
  {{- end }}
  deployment: |
    spec:
      template:
        spec:
          containers:
            - name: istio-proxy
              resources:
                {{- toYaml $gw.resources | nindent 16 }}
  {{- with $gw.autoscaling }}
  horizontalPodAutoscaler: |
    spec:
      minReplicas: {{ .minReplicas }}
      maxReplicas: {{ .maxReplicas }}
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: {{ .targetCPUUtilizationPercentage }}
  {{- end }}
  {{- with $gw.podDisruptionBudget }}
  podDisruptionBudget: |
    spec:
      {{- toYaml . | nindent 6 }}
  {{- end }}
{{- end }}
---
# Wildcard certificate for every hostname this gateway serves.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}-tls
  labels:
    {{- include "platform-gateway.labels" $ | nindent 4 }}
spec:
  secretName: {{ $name }}-tls
  dnsNames:
    - {{ $gw.hostname | quote }}
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    {{- toYaml $.Values.tls.issuer | nindent 4 }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $name }}
  labels:
    {{- include "platform-gateway.labels" $ | nindent 4 }}
  {{- if eq $impl "istio" }}
  annotations:
    networking.istio.io/service-type: {{ $gw.serviceType }}
  {{- end }}
spec:
  gatewayClassName: {{ $gw.className | default (eq $impl "agentgateway" | ternary "agentgateway" "istio") }}
  infrastructure:
    parametersRef:
      {{- if eq $impl "agentgateway" }}
      group: agentgateway.dev
      kind: AgentgatewayParameters
      {{- else }}
      group: ""
      kind: ConfigMap
      {{- end }}
      name: {{ $name }}-gateway-options
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: {{ $gw.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ $name }}-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              {{ $gw.accessLabel }}: "true"
    - name: http
      port: 80
      protocol: HTTP
      hostname: {{ $gw.hostname | quote }}
      allowedRoutes:
        namespaces:
          from: Same      # only the redirect below
---
# Every plain-HTTP request gets a 301 to the same URL on HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}-https-redirect
  labels:
    {{- include "platform-gateway.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $name }}
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
            {{- with $gw.redirectPort }}
            port: {{ . }}
            {{- end }}
{{- end }}
{{- end }}
