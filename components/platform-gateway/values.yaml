# Shared gateways, one per exposure level. Install this chart once per
# cluster, in its own namespace (e.g. infra-gw).
#
# Each gateway has two listeners:
#   https - app routes attach here (sectionName: https). TLS uses a
#           wildcard cert issued by cert-manager from the "lab-ca" issuer.
#   http  - only a platform-owned redirect to HTTPS; apps can't attach.
# Listener ports default to 443/80 (`ports`). Istio uses them as the gateway
# Service's ports, and the load balancer publishes those same ports.
# App namespaces need the gateway's access label (e.g. gateway-access/public=true)
# to attach routes; tenants get it from argocd/tenants/<team>.yaml.

tls:
  issuer:
    kind: ClusterIssuer
    name: lab-ca

gateways:
  public:
    enabled: true
    className: istio
    # Hostnames this gateway serves. Routes must use a hostname inside it.
    hostname: "*.apps.localhost"
    # A real LoadBalancer Service. In the lab, cloud-provider-kind
    # (k8s-lab-cluster) provides it and publishes the Service ports 1:1 on the
    # laptop -- so every gateway needs its own ports, or the second load
    # balancer can't bind. On EKS/GKE/AKS drop `ports` and `redirectPort`.
    serviceType: LoadBalancer
    ports:
      https: 8443
      http: 8080
    # Istio also puts its health port 15021 on every gateway Service; in the lab
    # that would be a third port both load balancers fight over. Kubelet probes
    # go to the pod, so nothing needs it on the Service. Keep it on a cloud LB
    # that health-checks through it.
    hideStatusPort: true
    # Port the HTTP->HTTPS redirect points at. Omit when clients use 443.
    redirectPort: 8443
    # Namespaces need this label (value "true") to attach routes.
    accessLabel: gateway-access/public
    # High availability: every app behind this gateway depends on it.
    autoscaling:
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      minAvailable: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi

  internal:
    enabled: true
    className: istio
    hostname: "*.internal.localhost"
    serviceType: LoadBalancer
    ports:
      https: 9443
      http: 9080
    hideStatusPort: true
    redirectPort: 9443
    accessLabel: gateway-access/internal
    autoscaling:
      minReplicas: 1
      maxReplicas: 2
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget: {}
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
