# Publishes the lab root CA as ConfigMap "lab-ca-bundle" (key ca.crt) in
# every namespace, so any workload can trust certs issued by lab-ca.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: lab-ca-bundle
spec:
  sources:
    - secret:
        name: lab-root-ca
        key: ca.crt
  target:
    configMap:
      key: ca.crt
