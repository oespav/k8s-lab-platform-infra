# The platform team's project: may deploy anything, anywhere, but only from
# this repo and the upstream chart repositories listed here.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Cluster platform components owned by the platform team
  sourceRepos:
    - https://github.com/oespav/k8s-lab-platform-infra.git
    - https://argoproj.github.io/argo-helm
    - https://charts.jetstack.io
    - oci://cr.agentgateway.dev/charts/*
    - https://kubernetes-sigs.github.io/metrics-server/
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
