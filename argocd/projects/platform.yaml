# The platform team's project: may deploy anything, anywhere, but only from
# this repo and the upstream chart repositories listed here.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Cluster platform components owned by the platform team
  sourceRepos:
    - http://gitea.github-sim.svc.cluster.local:3000/platform-team/platform-infra.git
    - https://argoproj.github.io/argo-helm
    - https://charts.jetstack.io
    - https://istio-release.storage.googleapis.com/charts
    - https://kubernetes-sigs.github.io/metrics-server/
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
