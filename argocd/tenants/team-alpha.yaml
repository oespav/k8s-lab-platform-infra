# Tenant: team-alpha. Onboarding a team = one file like this, reviewed by the platform team.
# The team owns what's in its repo; this file decides WHERE it may go and WHAT it may create.
apiVersion: v1
kind: Namespace
metadata:
  name: team-alpha
  labels:
    gateway-access/public: "true"
    team: team-alpha
    istio.io/dataplane-mode: ambient   # in the mesh: mTLS + identity on every connection
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: team-alpha
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: "Team Alpha: customer-facing hello-alpha"
  # Only the team's own repo.
  sourceRepos:
    - https://github.com/oespav/k8s-lab-hello-alpha.git
  # Only the team's own namespace.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: team-alpha
  # No cluster-scoped resources (Namespaces, ClusterRoles, CRDs, ...).
  clusterResourceWhitelist: []
  # Only the namespaced kinds an app team needs.
  namespaceResourceWhitelist:
    - {group: apps, kind: Deployment}
    - {group: "", kind: Service}
    - {group: "", kind: ConfigMap}
    - {group: "", kind: ServiceAccount}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute}
    - {group: autoscaling, kind: HorizontalPodAutoscaler}
    - {group: policy, kind: PodDisruptionBudget}
    # Teams decide who may call their services (identity-based, enforced by ztunnel).
    - {group: security.istio.io, kind: AuthorizationPolicy}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-alpha
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: team-alpha
  source:
    repoURL: https://github.com/oespav/k8s-lab-hello-alpha.git
    targetRevision: main
    path: chart
    helm:
      releaseName: hello-alpha
      valueFiles:
        - ../environments/lab/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: team-alpha
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 2m}
