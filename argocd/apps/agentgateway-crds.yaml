# Sync wave -8: the root app waits for lower waves to be Healthy first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentgateway-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: agentgateway-system
  sources:
    # OCI registry registered as a Helm repo (components/argocd-repos), so the
    # familiar repoURL + chart form works. The oci:// source style needs
    # path "." which this Argo CD version normalises away and then rejects.
    - repoURL: cr.agentgateway.dev/charts
      chart: agentgateway-crds
      targetRevision: 1.5.0
      helm:
        releaseName: agentgateway-crds
        valueFiles:
          - $values/components/agentgateway/agentgateway-crds-values.yaml
    - repoURL: https://github.com/oespav/k8s-lab-platform-infra.git
      targetRevision: agentgateway
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
