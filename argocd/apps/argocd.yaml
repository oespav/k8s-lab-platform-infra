# Argo CD manages itself. bootstrap/ installs it once with Helm using the
# same chart version and values; this Application then adopts it, so later
# Argo CD upgrades are just a commit changing targetRevision below.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  # No resources-finalizer: deleting this Application must never delete Argo CD.
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.9.2
      helm:
        releaseName: argocd
        valueFiles:
          - $values/components/argocd/values.yaml
    - repoURL: https://github.com/oespav/k8s-lab-platform-infra.git
      targetRevision: no-waypoint
      ref: values
    - repoURL: https://github.com/oespav/k8s-lab-platform-infra.git
      targetRevision: no-waypoint
      path: components/argocd/extra
  syncPolicy:
    automated:
      prune: false      # never auto-delete parts of the tool doing the deleting
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
