# Sync wave -5: the root app waits for lower waves to be Healthy first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mesh-policy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  source:
    repoURL: https://github.com/oespav/k8s-lab-platform-infra.git
    targetRevision: hybrid-edge
    path: components/mesh-policy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
