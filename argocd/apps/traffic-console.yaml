# Sync wave 5: platform tooling, after gateways and trust bundle exist.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traffic-console
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: traffic-console
  source:
    repoURL: https://github.com/oespav/k8s-lab-platform-infra.git
    targetRevision: main
    path: components/traffic-console
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
