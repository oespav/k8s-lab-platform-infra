# Sync wave -7: the root app waits for lower waves to be Healthy first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentgateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-7"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: agentgateway-system
  sources:
    - repoURL: oci://cr.agentgateway.dev/charts
      chart: agentgateway
      targetRevision: 1.5.0
      helm:
        releaseName: agentgateway
        valueFiles:
          - $values/components/agentgateway/agentgateway-values.yaml
    - repoURL: https://github.com/oespav/k8s-lab-platform-infra.git
      targetRevision: agentgateway
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
